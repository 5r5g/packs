<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>✦ SPINNING LOOTBOX | CENTER LINE SELECTOR ✦</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            background: radial-gradient(circle at 20% 10%, #1e0a2b, #2a0a1a, #0f030c);
            min-height: 100vh;
            color: #ffecb3;
            overflow-x: hidden;
        }

        /* animated gradient */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 40% 50%, rgba(156, 39, 176, 0.3), rgba(255, 80, 40, 0.2), rgba(255, 215, 0, 0.08));
            pointer-events: none;
            z-index: 0;
            animation: royalShift 12s infinite alternate;
        }

        @keyframes royalShift {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* canvas for stars/comets */
        #canvasFx {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 2.8rem;
            text-align: center;
            background: linear-gradient(135deg, #ffd966, #ff6a4b, #c154e0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .balance-card {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 80px;
            display: inline-block;
            padding: 8px 32px;
            border: 1px solid #ffaa66;
            box-shadow: 0 0 25px rgba(255, 80, 40, 0.7);
            margin: 20px auto;
            text-align: center;
        }

        .balance-card span {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(145deg, #ffd966, #ffaa55);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* TABS */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            border-bottom: 2px solid rgba(255, 100, 80, 0.5);
            padding-bottom: 12px;
        }

        .tab-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 8px 32px;
            border-radius: 60px;
            cursor: pointer;
            color: #ffcf9a;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: linear-gradient(145deg, #ff4d4d, #b83bc2);
            color: #fff0b5;
            box-shadow: 0 0 18px #ff66aa;
        }

        .tab-content {
            display: none;
            animation: fadeGlow 0.4s ease;
        }

        .tab-content.active-tab { display: block; }

        @keyframes fadeGlow {
            from { opacity: 0; transform: scale(0.98);}
            to { opacity: 1; transform: scale(1);}
        }

        /* PACKS GRID */
        .packs-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
        }

        .pack-card {
            background: rgba(20, 8, 28, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 20px;
            width: 250px;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 120, 80, 0.7);
            cursor: pointer;
        }

        .pack-card:hover {
            transform: translateY(-10px);
            border-color: #ffaa66;
            box-shadow: 0 0 35px rgba(255, 80, 120, 0.6);
        }

        .pack-thumb {
            width: 90px;
            height: 90px;
            object-fit: contain;
            background: #00000055;
            border-radius: 28px;
            padding: 8px;
        }

        .pack-name {
            font-size: 1.6rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ffb347, #ff6a4b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 10px 0;
        }

        .pack-cost {
            background: #000000aa;
            display: inline-block;
            padding: 6px 20px;
            border-radius: 40px;
            font-weight: bold;
            border: 1px solid #ff884d;
        }

        .open-case-btn {
            background: radial-gradient(circle at 30% 10%, #ff884d, #a83f9c);
            border: none;
            color: #fff0cc;
            font-weight: bold;
            padding: 10px 0;
            width: 100%;
            border-radius: 60px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 12px;
            transition: 0.05s linear;
        }

        .settings-panel {
            background: rgba(25, 10, 30, 0.88);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 30px;
            max-width: 500px;
            margin: 0 auto;
            border: 1px solid #ff6a4b;
        }
        .setting-item { margin: 20px 0; display: flex; justify-content: space-between; align-items: center; }
        select, input { background: #2a1025; border: 1px solid #ff8866; padding: 8px 16px; border-radius: 32px; color: #ffdead; }
        .disabled-tab { text-align: center; margin-top: 80px; font-size: 1.4rem; opacity: 0.6; }

        /* CONFIRMATION PANEL (slides from bottom) */
        .confirm-overlay {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            z-index: 200;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            transition: bottom 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .confirm-overlay.active { bottom: 0; }
        .confirm-card {
            background: linear-gradient(145deg, #2a1a35, #160c20);
            border-radius: 48px 48px 0 0;
            padding: 30px 40px 45px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            border-top: 3px solid #ffaa66;
        }
        .confirm-buttons { display: flex; gap: 20px; justify-content: center; margin-top: 25px; }
        .confirm-btn { padding: 12px 32px; border-radius: 60px; font-size: 1.1rem; font-weight: bold; border: none; cursor: pointer; }
        .confirm-yes { background: #ff7744; color: white; }
        .confirm-no { background: #3a2a44; color: #ffccaa; }

        /* SPINNING MODAL */
        .spin-modal {
            position: fixed;
            top: 100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: top 0.45s cubic-bezier(0.2, 0.95, 0.4, 1.05);
        }
        .spin-modal.active { top: 0; }
        .spin-container {
            background: #130a1cee;
            border-radius: 60px;
            padding: 25px 35px 40px;
            width: 90%;
            max-width: 1200px;
            text-align: center;
            border: 2px solid #ffaa66;
            transition: transform 0.2s ease-out;
        }

        /* REEL WITH CENTER LINE */
        .reel-wrapper {
            position: relative;
            margin: 20px 0;
            overflow: hidden;
            border-radius: 50px;
            background: #0a0312aa;
            padding: 20px;
            border: 2px solid #ff884d;
        }
        .spinning-track {
            display: flex;
            gap: 16px;
            will-change: transform;
        }
        .spin-item {
            flex: 0 0 auto;
            width: 160px;
            background: #231b2e;
            border-radius: 28px;
            padding: 15px 10px;
            text-align: center;
            border: 1px solid #ffaa77;
        }
        .spin-item img { width: 90px; height: 90px; object-fit: contain; }
        .spin-item span { display: block; font-size: 0.8rem; margin-top: 8px; }

        /* THE CENTER SELECTOR LINE - VISIBLE AND GLOWING */
        .center-selector {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            background: linear-gradient(to bottom, #ff3366, #ffd966, #ff3366);
            box-shadow: 0 0 30px #ff3366, 0 0 15px gold;
            z-index: 50;
            pointer-events: none;
            border-radius: 3px;
        }
        .center-selector::before {
            content: "▼";
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            color: #ffcc77;
            text-shadow: 0 0 12px red;
        }
        .center-selector::after {
            content: "▲";
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            color: #ffcc77;
            text-shadow: 0 0 12px red;
        }

        .result-area {
            margin-top: 20px;
            background: rgba(0,0,0,0.7);
            border-radius: 40px;
            padding: 18px;
        }
        .close-spin {
            background: linear-gradient(145deg, #ff7744, #b83bc2);
            border: none;
            padding: 12px 32px;
            border-radius: 60px;
            font-size: 1.1rem;
            margin-top: 18px;
            cursor: pointer;
            color: white;
        }
        .winner-text {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #ffd966, #ffaa66);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: bold;
        }

        @keyframes flashAnim {
            0% { background: radial-gradient(circle, rgba(255,215,0,0) 0%, rgba(0,0,0,0) 70%);}
            40% { background: radial-gradient(circle, rgba(255,200,100,0.98) 0%, rgba(255,60,80,0.95) 100%);}
            100% { background: radial-gradient(circle, rgba(255,215,0,0) 0%, rgba(0,0,0,0) 70%);}
        }
        .flash-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 1000;
            animation: flashAnim 0.35s ease-out forwards;
        }
    </style>
</head>
<body>
<canvas id="canvasFx"></canvas>
<div class="container">
    <div style="text-align: center;"><h1>✦ SPINNING SELECTOR LOOTBOX ✦</h1></div>
    <div style="display: flex; justify-content: center;"><div class="balance-card">💎 GEMS: <span id="userBalance">10000</span></div></div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="packs">📦 CASES</button>
        <button class="tab-btn" data-tab="settings">⚙️ EFFECTS</button>
        <button class="tab-btn" data-tab="wins">🏆 HISTORY</button>
    </div>
    <div id="packsTab" class="tab-content active-tab"><div id="packsContainer" class="packs-grid"><div>✨ Loading cases...</div></div></div>
    <div id="settingsTab" class="tab-content"><div class="settings-panel"><h3>🎮 VISUAL FX</h3><div class="setting-item"><label>💥 ZOOM + FLASH</label><input type="checkbox" id="toggleZoomFlash" checked></div><div class="setting-item"><label>🌠 STARS & COMETS</label><input type="checkbox" id="toggleStars" checked></div><div class="setting-item"><label>🎞️ SPIN SPEED</label><select id="rollSpeed"><option value="8">FAST</option><option value="5.5" selected>DRAMATIC</option><option value="3.2">CINEMATIC</option></select></div></div></div>
    <div id="winsTab" class="tab-content"><div class="disabled-tab">🏆 PREVIOUS WINS - COMING SOON 🏆</div></div>
</div>

<!-- CONFIRM PANEL -->
<div id="confirmPanel" class="confirm-overlay">
    <div class="confirm-card">
        <h2 style="color:#ffaa77;">⚠️ CONFIRM OPEN</h2>
        <p id="confirmPackInfo" style="margin:15px 0; font-size:1.2rem;">Case - 0 GEMS</p>
        <div class="confirm-buttons">
            <button id="confirmYes" class="confirm-btn confirm-yes">YES, OPEN</button>
            <button id="confirmNo" class="confirm-btn confirm-no">CANCEL</button>
        </div>
    </div>
</div>

<!-- SPIN MODAL -->
<div id="spinModal" class="spin-modal">
    <div class="spin-container" id="spinContainer">
        <h2 style="color:#ffaa77;">🎯 CENTER LINE · SPINNING REEL</h2>
        <div class="reel-wrapper">
            <div id="spinTrack" class="spinning-track"></div>
            <div class="center-selector"></div>
        </div>
        <div id="resultArea" class="result-area"></div>
        <button id="closeSpin" class="close-spin">CONTINUE</button>
    </div>
</div>

<script>
    // ========= CONFIG ==========
    const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1498140574316888164/6f0h7UyyEVZUtg1DQItPHgyXeCtzhj1eQWUQAzdDRCBKBS8ZnzMwnPqFeXiQpu8Z5HEc";
    const PACKS_SHEET_ID = "181RdB0KhPbjnSHq-t7n_KhCFwwQwU8q4dU91u-MSHr4";
    const ITEMS_SHEET_ID = "1d0mZIPIKxWvcHRxoB6Bm20tMyx1OcfISOoy7Yi9u6jY";
    const PACKS_CSV = `https://docs.google.com/spreadsheets/d/${PACKS_SHEET_ID}/export?format=csv&gid=0`;
    const ITEMS_CSV = `https://docs.google.com/spreadsheets/d/${ITEMS_SHEET_ID}/export?format=csv&gid=0`;

    let packsData = [], itemsData = [];
    let userGems = 10000;
    let selectedPack = null;
    let animationId = null;

    // DOM
    const packsContainer = document.getElementById('packsContainer');
    const balanceSpan = document.getElementById('userBalance');
    const confirmPanel = document.getElementById('confirmPanel');
    const confirmPackInfo = document.getElementById('confirmPackInfo');
    const confirmYes = document.getElementById('confirmYes');
    const confirmNo = document.getElementById('confirmNo');
    const spinModal = document.getElementById('spinModal');
    const spinTrack = document.getElementById('spinTrack');
    const resultArea = document.getElementById('resultArea');
    const closeSpin = document.getElementById('closeSpin');
    const spinContainer = document.getElementById('spinContainer');
    const toggleZoomFlash = document.getElementById('toggleZoomFlash');
    const toggleStars = document.getElementById('toggleStars');
    const rollSpeedSelect = document.getElementById('rollSpeed');

    function updateBalance() { balanceSpan.innerText = userGems; }

    // Starfield
    const canvas = document.getElementById('canvasFx');
    let ctx = canvas.getContext('2d');
    let stars = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    function initStars() { stars = []; for(let i=0;i<70;i++) { stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 2.5 + 1, alpha: Math.random() * 0.7 + 0.3, speedX: (Math.random() - 0.5) * 0.3, speedY: Math.random() * 1.5 + 0.5, comet: Math.random() > 0.8 }); } }
    function drawStars() { if(!toggleStars.checked) { ctx.clearRect(0,0,canvas.width,canvas.height); requestAnimationFrame(drawStars); return; } ctx.clearRect(0,0,canvas.width,canvas.height); for(let s of stars) { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fillStyle = `rgba(255, 200, 100, ${s.alpha})`; ctx.fill(); s.x += s.speedX; s.y += s.speedY; if(s.x > canvas.width) s.x = 0; if(s.y > canvas.height) s.y = 0; if(s.x < 0) s.x = canvas.width; if(s.y < 0) s.y = canvas.height; } requestAnimationFrame(drawStars); }
    resizeCanvas(); initStars(); drawStars();

    // Load data
    async function loadData() {
        try {
            const packResp = await fetch(PACKS_CSV); const packCsv = await packResp.text();
            const packRows = parseCSV(packCsv);
            packsData = packRows.map(r => ({ name: r.PackName, color: r.PackColor, cost: parseInt(r.PackCost), thumbnail: r.PackThumbnail || "https://i.imgur.com/9MjQ9sD.png" })).filter(p=>p.name);
            const itemResp = await fetch(ITEMS_CSV); const itemCsv = await itemResp.text();
            const itemRows = parseCSV(itemCsv);
            itemsData = itemRows.map(r => ({ name: r.ItemName, goldValue: parseInt(r.GoldValue), belongsToPack: r.BelongsToPack, thumbnail: r.ItemThumbnail, rarity: r.CardRarity, dropChance: parseFloat(r.dropChance) || (r.CardRarity === "Chaser"?5:95) })).filter(i=>i.name);
            if(packsData.length===0) packsData = [{ name:"Boots", color:"#E03FD8", cost:1000, thumbnail:"https://i.imgur.com/9MjQ9sD.png"}];
            if(itemsData.length===0) itemsData = [{ name:"Rainbow Boot", goldValue:10000, belongsToPack:"Boots", thumbnail:"https://trello.com/1/cards/69e1360a5fb96873ddeb5958/attachments/69e13611771b34a309ccacb7/download/image.png", rarity:"Chaser", dropChance:5},{ name:"Old Boot", goldValue:20, belongsToPack:"Boots", thumbnail:"https://trello.com/1/cards/69e13d2662c6fe6dfaae7fb0/attachments/69e13d2eb7b4c5c9e4798060/download/image.png", rarity:"Ordinary", dropChance:95}];
            renderPacks();
        } catch(e) { console.warn(e); fallbackLocal(); renderPacks(); }
    }
    function fallbackLocal() { packsData = [{ name:"Boots", color:"#E03FD8", cost:1000, thumbnail:"https://i.imgur.com/9MjQ9sD.png"}]; itemsData = [{ name:"Rainbow Boot", goldValue:10000, belongsToPack:"Boots", thumbnail:"https://trello.com/1/cards/69e1360a5fb96873ddeb5958/attachments/69e13611771b34a309ccacb7/download/image.png", rarity:"Chaser", dropChance:5},{ name:"Old Boot", goldValue:20, belongsToPack:"Boots", thumbnail:"https://trello.com/1/cards/69e13d2662c6fe6dfaae7fb0/attachments/69e13d2eb7b4c5c9e4798060/download/image.png", rarity:"Ordinary", dropChance:95}]; }
    function parseCSV(csv) { const lines = csv.split(/\r?\n/).filter(l=>l.trim()); if(lines.length<2) return []; const headers = lines[0].split(',').map(h=>h.replace(/"/g,'').trim()); let res=[]; for(let i=1;i<lines.length;i++) { let values=[], inQuote=false, cur=''; for(let ch of lines[i]){ if(ch==='"') inQuote=!inQuote; else if(ch===',' && !inQuote) { values.push(cur.trim().replace(/^"|"$/g,'')); cur=''; } else cur+=ch; } values.push(cur.trim().replace(/^"|"$/g,'')); let obj={}; headers.forEach((h,idx)=>{ obj[h]=values[idx]||''; }); res.push(obj); } return res; }
    function renderPacks() { packsContainer.innerHTML = packsData.map(pack => `<div class="pack-card"><img class="pack-thumb" src="${pack.thumbnail}"><div class="pack-name">${pack.name}</div><div class="pack-cost">💎 ${pack.cost} GEMS</div><button class="open-case-btn" data-name="${pack.name}">SELECT CASE</button></div>`).join(''); document.querySelectorAll('.open-case-btn').forEach(btn => { btn.addEventListener('click', (e) => { const packName = btn.getAttribute('data-name'); const pack = packsData.find(p => p.name === packName); if(pack) showConfirm(pack); }); }); }

    function showConfirm(pack) { if(userGems < pack.cost) { alert(`Need ${pack.cost} gems!`); return; } selectedPack = pack; confirmPackInfo.innerText = `${pack.name} Case - ${pack.cost} GEMS`; confirmPanel.classList.add('active'); }
    confirmYes.addEventListener('click', async () => { if(!selectedPack) return; confirmPanel.classList.remove('active'); userGems -= selectedPack.cost; updateBalance(); spinModal.classList.add('active'); await startSpin(selectedPack); });
    confirmNo.addEventListener('click', () => { confirmPanel.classList.remove('active'); selectedPack = null; });

    function getWeightedItem(packName) { 
        let eligible = itemsData.filter(i => i.belongsToPack?.toLowerCase() === packName.toLowerCase()); 
        if(!eligible.length) return { name:"Mystery Item", goldValue:50, thumbnail:"https://i.imgur.com/9MjQ9sD.png", rarity:"Common" }; 
        let total = eligible.reduce((s,i)=> s + (i.dropChance || 1), 0); let rand = Math.random() * total; let accum = 0;
        for(let item of eligible){ accum += (item.dropChance || 1); if(rand <= accum) return item; } return eligible[0];
    }
    async function sendDiscord(pack, item){ if(!DISCORD_WEBHOOK) return; try{ fetch(DISCORD_WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({embeds:[{title:`🎁 ${pack.name} OPENED`,description:`**${item.name}** was selected by the center line!`,color:0xdd55aa,fields:[{name:"Rarity",value:item.rarity},{name:"Value",value:`${item.goldValue} 💎`}],thumbnail:{url:item.thumbnail}}]})}); } catch(e){} }

    async function startSpin(pack) {
        const allItems = itemsData.filter(i => i.belongsToPack?.toLowerCase() === pack.name.toLowerCase());
        if(allItems.length===0) return;
        const finalItem = getWeightedItem(pack.name);
        
        // Build reel items (100+ items for smooth scroll)
        let reelItems = [];
        for(let i=0;i<80;i++) reelItems.push(allItems[Math.floor(Math.random()*allItems.length)]);
        reelItems.push(finalItem);
        for(let i=0;i<40;i++) reelItems.push(finalItem);
        
        spinTrack.innerHTML = '';
        reelItems.forEach(item => {
            const div = document.createElement('div'); div.className = 'spin-item';
            div.innerHTML = `<img src="${item.thumbnail}" onerror="this.src='https://i.imgur.com/9MjQ9sD.png'"><span>${item.name.substring(0,12)}</span>`;
            spinTrack.appendChild(div);
        });
        
        let position = 0;
        const itemWidth = 176;
        const totalWidth = reelItems.length * itemWidth;
        spinTrack.style.width = `${totalWidth}px`;
        
        let speed = parseFloat(rollSpeedSelect.value);
        let decel = 0.992;
        let minSpeed = 0.12;
        let zoomScale = 1;
        let zoomDirection = 1;
        
        function applyZoom(scale) { spinContainer.style.transform = `scale(${scale})`; }
        
        async function doFlashZoom() {
            if(!toggleZoomFlash.checked) return;
            for(let s=1; s<1.35; s+=0.03) { applyZoom(s); await new Promise(r=>setTimeout(r,12)); }
            const flash = document.createElement('div'); flash.classList.add('flash-overlay'); document.body.appendChild(flash);
            for(let s=1.35; s>0.85; s-=0.07) { applyZoom(s); await new Promise(r=>setTimeout(r,10)); }
            applyZoom(1);
            setTimeout(() => flash.remove(), 300);
        }
        
        function animate() {
            position += speed;
            if(position >= totalWidth - 600) {
                speed *= decel;
                if(speed < minSpeed) {
                    cancelAnimationFrame(animationId);
                    const centerIndex = Math.floor(position / itemWidth) + 3;
                    const landed = reelItems[Math.min(centerIndex, reelItems.length-1)];
                    doFlashZoom().then(() => {
                        resultArea.innerHTML = `<div class="winner-text">🏆 ${landed.name} 🏆</div><img src="${landed.thumbnail}" style="width:90px; border-radius:20px; margin:10px;"><div>✨ Rarity: ${landed.rarity} | 💎 Value: ${landed.goldValue}</div><div>🎯 CENTER LINE LANDED ON: ${landed.name}</div>`;
                        sendDiscord(pack, landed);
                    });
                    return;
                }
            }
            if(zoomDirection === 1 && zoomScale < 1.25) { zoomScale += 0.003; applyZoom(zoomScale); }
            spinTrack.style.transform = `translateX(-${position}px)`;
            animationId = requestAnimationFrame(animate);
        }
        
        resultArea.innerHTML = '<div style="color:#ffaa77;">🌀 SPINNING... WATCH THE CENTER LINE 🌀</div>';
        applyZoom(1);
        animate();
    }
    
    closeSpin.addEventListener('click', () => { if(animationId) cancelAnimationFrame(animationId); spinModal.classList.remove('active'); spinTrack.innerHTML = ''; resultArea.innerHTML = ''; spinContainer.style.transform = 'scale(1)'; selectedPack = null; });
    
    // Tabs
    document.querySelectorAll('.tab-btn').forEach(btn => { btn.addEventListener('click', () => { document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active-tab')); const id = btn.getAttribute('data-tab'); if(id==='packs') document.getElementById('packsTab').classList.add('active-tab'); if(id==='settings') document.getElementById('settingsTab').classList.add('active-tab'); if(id==='wins') document.getElementById('winsTab').classList.add('active-tab'); }); });
    
    loadData();
    updateBalance();
</script>
</body>
</html>

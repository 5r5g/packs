<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>✦ PREMIUM LOOTBOX | SPINNING REEL + CINEMATIC ZOOM ✦</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', 'Impact', system-ui, sans-serif;
            background: radial-gradient(circle at 20% 10%, #1e0a2b, #2a0a1a, #0f030c);
            min-height: 100vh;
            color: #ffecb3;
            overflow-x: hidden;
            position: relative;
        }

        /* animated gradient background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 40% 50%, rgba(156, 39, 176, 0.3), rgba(255, 80, 40, 0.2), rgba(255, 215, 0, 0.1));
            pointer-events: none;
            z-index: 0;
            animation: royalShift 12s infinite alternate;
        }

        @keyframes royalShift {
            0% { opacity: 0.5; background: radial-gradient(circle at 30% 40%, rgba(156,39,176,0.4), rgba(255,80,40,0.15), rgba(255,215,0,0.05));}
            100% { opacity: 1; background: radial-gradient(circle at 70% 60%, rgba(255,80,40,0.45), rgba(156,39,176,0.4), rgba(255,200,0,0.12));}
        }

        /* canvas for stars/comets */
        #canvasFx {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 20;
        }

        h1 {
            font-size: 3rem;
            text-align: center;
            background: linear-gradient(135deg, #ffd966, #ff6a4b, #c154e0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 25px rgba(193, 84, 224, 0.5);
        }

        .balance-card {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 80px;
            display: inline-block;
            padding: 8px 32px;
            border: 1px solid #ffaa66;
            box-shadow: 0 0 25px rgba(255, 80, 40, 0.7);
            margin: 20px auto;
            text-align: center;
        }

        .balance-card span {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(145deg, #ffd966, #ffaa55);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* TABS */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            border-bottom: 2px solid rgba(255, 100, 80, 0.5);
            padding-bottom: 12px;
        }

        .tab-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 8px 32px;
            border-radius: 60px;
            cursor: pointer;
            color: #ffcf9a;
            transition: 0.2s;
            backdrop-filter: blur(5px);
        }

        .tab-btn.active {
            background: linear-gradient(145deg, #ff4d4d, #b83bc2);
            color: #fff0b5;
            box-shadow: 0 0 18px #ff66aa;
        }

        .tab-content {
            display: none;
            animation: fadeGlow 0.4s ease;
        }

        .tab-content.active-tab { display: block; }

        @keyframes fadeGlow {
            from { opacity: 0; transform: scale(0.98); filter: blur(3px);}
            to { opacity: 1; transform: scale(1); filter: blur(0);}
        }

        /* PACKS GRID - Sleek modern cases */
        .packs-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
        }

        .pack-card {
            background: rgba(20, 8, 28, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 20px;
            width: 260px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: 1px solid rgba(255, 120, 80, 0.7);
            cursor: pointer;
        }

        .pack-card:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: #ffaa66;
            box-shadow: 0 0 35px rgba(255, 80, 120, 0.7);
        }

        .pack-thumb {
            width: 100px;
            height: 100px;
            object-fit: contain;
            background: #00000055;
            border-radius: 28px;
            padding: 8px;
        }

        .pack-name {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ffb347, #ff6a4b, #dd88ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 10px 0;
        }

        .pack-cost {
            background: #000000aa;
            display: inline-block;
            padding: 6px 20px;
            border-radius: 40px;
            font-weight: bold;
            border: 1px solid #ff884d;
        }

        .open-case-btn {
            background: radial-gradient(circle at 30% 10%, #ff884d, #a83f9c);
            border: none;
            color: #fff0cc;
            font-weight: bold;
            padding: 12px 0;
            width: 100%;
            border-radius: 60px;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 12px;
            transition: 0.05s linear;
            box-shadow: 0 5px 0 #5a2a55;
        }

        .open-case-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #5a2a55; }

        .settings-panel {
            background: rgba(25, 10, 30, 0.88);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 30px;
            max-width: 550px;
            margin: 0 auto;
            border: 1px solid #ff6a4b;
        }
        .setting-item { margin: 20px 0; display: flex; justify-content: space-between; align-items: center; }
        select, input { background: #2a1025; border: 1px solid #ff8866; padding: 8px 16px; border-radius: 32px; color: #ffdead; font-weight: bold; }
        .disabled-tab { text-align: center; margin-top: 80px; font-size: 1.6rem; opacity: 0.6; font-style: italic; }

        /* ---------- SLIDING CONFIRMATION PANEL (BOTTOM -> TOP) ---------- */
        .confirm-overlay {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            z-index: 200;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            transition: bottom 0.45s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .confirm-overlay.active { bottom: 0; }
        .confirm-card {
            background: linear-gradient(145deg, #2a1a35, #160c20);
            border-radius: 48px 48px 0 0;
            padding: 30px 40px 45px;
            width: 100%;
            max-width: 550px;
            text-align: center;
            border-top: 3px solid #ffaa66;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
        }
        .confirm-buttons { display: flex; gap: 20px; justify-content: center; margin-top: 25px; }
        .confirm-btn { padding: 12px 32px; border-radius: 60px; font-size: 1.2rem; font-weight: bold; border: none; cursor: pointer; }
        .confirm-yes { background: #ff7744; color: white; }
        .confirm-no { background: #3a2a44; color: #ffccaa; }

        /* ---------- SPINNING REEL MODAL (SLIDES UP AFTER CONFIRM) ---------- */
        .spin-modal {
            position: fixed;
            top: 100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(20px);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: top 0.5s cubic-bezier(0.2, 0.95, 0.4, 1.05);
            flex-direction: column;
        }
        .spin-modal.active { top: 0; }
        .spin-container {
            background: #130a1cee;
            border-radius: 64px;
            padding: 30px 40px;
            width: 90%;
            max-width: 1300px;
            text-align: center;
            border: 2px solid #ffaa66;
            transition: transform 0.3s;
        }
        .reel-wrapper {
            position: relative;
            margin: 20px 0;
            overflow: hidden;
            border-radius: 60px;
            background: #0a0312aa;
            padding: 20px;
            box-shadow: inset 0 0 25px #000, 0 0 0 2px #ff884d;
        }
        .spinning-track {
            display: flex;
            gap: 20px;
            will-change: transform;
        }
        .spin-item {
            flex: 0 0 auto;
            width: 170px;
            background: #231b2e;
            border-radius: 32px;
            padding: 18px 12px;
            text-align: center;
            border: 1px solid #ffaa77;
        }
        .spin-item img { width: 100px; height: 100px; object-fit: contain; }
        .result-final {
            margin-top: 25px;
            background: rgba(0,0,0,0.7);
            border-radius: 48px;
            padding: 20px;
        }
        .close-spin { background: linear-gradient(145deg, #ff7744, #b83bc2); border: none; padding: 12px 32px; border-radius: 60px; font-size: 1.2rem; margin-top: 20px; cursor: pointer; color: white; }
        .winner-big {
            font-size: 2rem;
            background: linear-gradient(135deg, #ffd966, #ffaa66);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        @keyframes globalFlash {
            0% { background: radial-gradient(circle, rgba(255,215,0,0) 0%, rgba(0,0,0,0) 70%);}
            40% { background: radial-gradient(circle, rgba(255,200,100,0.98) 0%, rgba(255,60,80,0.95) 100%);}
            100% { background: radial-gradient(circle, rgba(255,215,0,0) 0%, rgba(0,0,0,0) 70%);}
        }
        .flash-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 1000;
            animation: globalFlash 0.4s ease-out forwards;
        }
    </style>
</head>
<body>
<canvas id="canvasFx"></canvas>
<div class="container">
    <div style="text-align: center;"><h1>✦ CINEMATIC SPIN LOOTBOX ✦</h1></div>
    <div style="display: flex; justify-content: center;"><div class="balance-card">💎 GEMS: <span id="userBalance">10000</span></div></div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="packs">📦 CASES</button>
        <button class="tab-btn" data-tab="settings">⚙️ FX</button>
        <button class="tab-btn" data-tab="wins">🏆 HISTORY</button>
    </div>
    <div id="packsTab" class="tab-content active-tab"><div id="packsContainer" class="packs-grid"><div>✨ loading cases...</div></div></div>
    <div id="settingsTab" class="tab-content"><div class="settings-panel"><h3>🌟 VISUAL EFFECTS</h3><div class="setting-item"><label>💥 ZOOM + FLASH IMPACT</label><input type="checkbox" id="toggleZoomFlash" checked></div><div class="setting-item"><label>🌠 COMETS & STARS</label><input type="checkbox" id="toggleStars" checked></div><div class="setting-item"><label>🎞️ SPIN SPEED</label><select id="rollSpeed"><option value="1">FAST</option><option value="2" selected>DRAMATIC</option><option value="3">CINEMATIC SLOW</option></select></div></div></div>
    <div id="winsTab" class="tab-content"><div class="disabled-tab">🏆 PREV WINS - COMING SOON 🏆</div></div>
</div>

<!-- CONFIRMATION PANEL (slides from bottom) -->
<div id="confirmPanel" class="confirm-overlay">
    <div class="confirm-card">
        <h2 style="color:#ffaa77;">⚠️ CONFIRM OPENING</h2>
        <p id="confirmPackInfo" style="margin:15px 0; font-size:1.2rem;">Boots Case - 1000 GEMS</p>
        <div class="confirm-buttons">
            <button id="confirmYes" class="confirm-btn confirm-yes">YES, OPEN</button>
            <button id="confirmNo" class="confirm-btn confirm-no">CANCEL</button>
        </div>
    </div>
</div>

<!-- SPINNING REEL MODAL (slides up after confirm) -->
<div id="spinModal" class="spin-modal">
    <div class="spin-container" id="spinContainerElem">
        <h2 style="color:#ffaa77;">🌀 SPINNING WHEEL · PREDICTING FATE</h2>
        <div class="reel-wrapper">
            <div id="spinTrack" class="spinning-track" style="transform: translateX(0px);"></div>
        </div>
        <div id="spinResultArea" class="result-final"></div>
        <button id="closeSpinBtn" class="close-spin">CONTINUE</button>
    </div>
</div>

<script>
    // ========= CONFIG ==========
    const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1498140574316888164/6f0h7UyyEVZUtg1DQItPHgyXeCtzhj1eQWUQAzdDRCBKBS8ZnzMwnPqFeXiQpu8Z5HEc";
    const PACKS_SHEET_ID = "181RdB0KhPbjnSHq-t7n_KhCFwwQwU8q4dU91u-MSHr4";
    const ITEMS_SHEET_ID = "1d0mZIPIKxWvcHRxoB6Bm20tMyx1OcfISOoy7Yi9u6jY";
    const PACKS_CSV = `https://docs.google.com/spreadsheets/d/${PACKS_SHEET_ID}/export?format=csv&gid=0`;
    const ITEMS_CSV = `https://docs.google.com/spreadsheets/d/${ITEMS_SHEET_ID}/export?format=csv&gid=0`;

    let packsData = [], itemsData = [];
    let userGems = 10000;
    let selectedPack = null;
    let currentSpinAnimation = null;
    let finalWinItem = null;

    // DOM elements
    const packsContainer = document.getElementById('packsContainer');
    const balanceSpan = document.getElementById('userBalance');
    const confirmPanel = document.getElementById('confirmPanel');
    const confirmPackInfo = document.getElementById('confirmPackInfo');
    const confirmYes = document.getElementById('confirmYes');
    const confirmNo = document.getElementById('confirmNo');
    const spinModal = document.getElementById('spinModal');
    const spinTrack = document.getElementById('spinTrack');
    const spinResultArea = document.getElementById('spinResultArea');
    const closeSpinBtn = document.getElementById('closeSpinBtn');
    const spinContainerElem = document.getElementById('spinContainerElem');
    const toggleZoomFlash = document.getElementById('toggleZoomFlash');
    const toggleStars = document.getElementById('toggleStars');
    const rollSpeedSelect = document.getElementById('rollSpeed');

    function updateBalanceUI() { balanceSpan.innerText = userGems; }

    // Starfield canvas
    const canvas = document.getElementById('canvasFx');
    let ctx = canvas.getContext('2d');
    let stars = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', () => { resizeCanvas(); initStars(80); });
    function initStars(count=85) { stars = []; for(let i=0;i<count;i++) { stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, radius: Math.random() * 2.8 + 1, alpha: Math.random() * 0.8 + 0.2, speedX: (Math.random() - 0.5) * 0.4, speedY: Math.random() * 2.2 + 0.8, isComet: Math.random() > 0.78, tail: Math.random() * 14 + 6 }); } }
    function drawStars() { if(!toggleStars.checked) { if(ctx) ctx.clearRect(0,0,canvas.width,canvas.height); return; } ctx.clearRect(0,0,canvas.width,canvas.height); for(let s of stars) { ctx.beginPath(); if(s.isComet) { ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.tail*0.9, s.y - s.tail*0.6); ctx.lineWidth = s.radius*1.6; ctx.strokeStyle = `rgba(255, 150, 80, ${s.alpha * 0.9})`; ctx.stroke(); ctx.beginPath(); ctx.arc(s.x, s.y, s.radius+1, 0, Math.PI*2); ctx.fillStyle = `rgba(255, 200, 100, ${s.alpha})`; ctx.fill(); } else { ctx.arc(s.x, s.y, s.radius, 0, Math.PI*2); ctx.fillStyle = `rgba(255, 215, 150, ${s.alpha})`; ctx.fill(); } s.x += s.speedX; s.y += s.speedY; if(s.x > canvas.width+60) s.x = -60; if(s.y > canvas.height+60) s.y = -40; if(s.x < -60) s.x = canvas.width+40; if(s.y < -40) s.y = canvas.height+30; } requestAnimationFrame(drawStars); }
    function startStarfield() { resizeCanvas(); initStars(85); drawStars(); }
    startStarfield();

    // Load data
    async function loadData() {
        try {
            const packResp = await fetch(PACKS_CSV); const packCsv = await packResp.text();
            const packRows = parseCSV(packCsv);
            packsData = packRows.map(r => ({ name: r.PackName, color: r.PackColor, cost: parseInt(r.PackCost), thumbnail: r.PackThumbnail || "https://i.imgur.com/9MjQ9sD.png" })).filter(p=>p.name);
            const itemResp = await fetch(ITEMS_CSV); const itemCsv = await itemResp.text();
            const itemRows = parseCSV(itemCsv);
            itemsData = itemRows.map(r => ({ name: r.ItemName, goldValue: parseInt(r.GoldValue), belongsToPack: r.BelongsToPack, thumbnail: r.ItemThumbnail, rarity: r.CardRarity, dropChance: parseFloat(r.dropChance) || (r.CardRarity === "Chaser"?5:95) })).filter(i=>i.name);
            if(packsData.length===0) packsData = [{ name:"Boots", color:"#E03FD8", cost:1000, thumbnail:"https://i.imgur.com/9MjQ9sD.png"}];
            if(itemsData.length===0) itemsData = [{ name:"Rainbow Boot", goldValue:10000, belongsToPack:"Boots", thumbnail:"https://trello.com/1/cards/69e1360a5fb96873ddeb5958/attachments/69e13611771b34a309ccacb7/download/image.png", rarity:"Chaser", dropChance:5},{ name:"Old Boot", goldValue:20, belongsToPack:"Boots", thumbnail:"https://trello.com/1/cards/69e13d2662c6fe6dfaae7fb0/attachments/69e13d2eb7b4c5c9e4798060/download/image.png", rarity:"Ordinary", dropChance:95}];
            renderPacks();
        } catch(e) { console.warn(e); fallbackLocal(); renderPacks(); }
    }
    function fallbackLocal() { packsData = [{ name:"Boots", color:"#E03FD8", cost:1000, thumbnail:"https://i.imgur.com/9MjQ9sD.png"}]; itemsData = [{ name:"Rainbow Boot", goldValue:10000, belongsToPack:"Boots", thumbnail:"https://trello.com/1/cards/69e1360a5fb96873ddeb5958/attachments/69e13611771b34a309ccacb7/download/image.png", rarity:"Chaser", dropChance:5},{ name:"Old Boot", goldValue:20, belongsToPack:"Boots", thumbnail:"https://trello.com/1/cards/69e13d2662c6fe6dfaae7fb0/attachments/69e13d2eb7b4c5c9e4798060/download/image.png", rarity:"Ordinary", dropChance:95}]; }
    function parseCSV(csv) { const lines = csv.split(/\r?\n/).filter(l=>l.trim()); if(lines.length<2) return []; const headers = lines[0].split(',').map(h=>h.replace(/"/g,'').trim()); let res=[]; for(let i=1;i<lines.length;i++) { let values=[], inQuote=false, cur=''; for(let ch of lines[i]){ if(ch==='"') inQuote=!inQuote; else if(ch===',' && !inQuote) { values.push(cur.trim().replace(/^"|"$/g,'')); cur=''; } else cur+=ch; } values.push(cur.trim().replace(/^"|"$/g,'')); let obj={}; headers.forEach((h,idx)=>{ obj[h]=values[idx]||''; }); res.push(obj); } return res; }
    function renderPacks() { packsContainer.innerHTML = packsData.map(pack => `<div class="pack-card"><img class="pack-thumb" src="${pack.thumbnail}" onerror="this.src='https://i.imgur.com/9MjQ9sD.png'"><div class="pack-name">${pack.name}</div><div class="pack-cost">💎 ${pack.cost} GEMS</div><button class="open-case-btn" data-name="${pack.name}">SELECT CASE</button></div>`).join(''); document.querySelectorAll('.open-case-btn').forEach(btn => { btn.addEventListener('click', (e) => { const packName = btn.getAttribute('data-name'); const pack = packsData.find(p => p.name === packName); if(pack) showConfirmPanel(pack); }); }); }

    function showConfirmPanel(pack) {
        if(userGems < pack.cost) { alert(`Not enough gems! Need ${pack.cost}`); return; }
        selectedPack = pack;
        confirmPackInfo.innerText = `${pack.name} Case - ${pack.cost} GEMS`;
        confirmPanel.classList.add('active');
    }

    confirmYes.addEventListener('click', async () => {
        if(!selectedPack) return;
        confirmPanel.classList.remove('active');
        // deduct gems
        userGems -= selectedPack.cost;
        updateBalanceUI();
        // slide up spin modal
        spinModal.classList.add('active');
        await startSpinningReel(selectedPack);
    });
    confirmNo.addEventListener('click', () => { confirmPanel.classList.remove('active'); selectedPack = null; });

    // weighted random
    function getRandomItemFromPack(packName) { 
        let eligible = itemsData.filter(i => i.belongsToPack?.toLowerCase() === packName.toLowerCase()); 
        if(!eligible.length) return { name:"Mystic Orb", goldValue:50, thumbnail:"https://i.imgur.com/9MjQ9sD.png", rarity:"Arcane" }; 
        let totalChance = eligible.reduce((s,i)=> s + (i.dropChance || 1), 0); let rand = Math.random() * totalChance; let accum=0;
        for(let item of eligible){ accum += (item.dropChance || 1); if(rand <= accum) return item; } return eligible[0];
    }
    async function sendDiscord(pack, item){ if(!DISCORD_WEBHOOK) return; try{ await fetch(DISCORD_WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({embeds:[{title:`✨ ${pack.name} UNBOXED`,description:`**${item.name}** spun into reality`,color:0xdd55aa,fields:[{name:"Rarity",value:item.rarity,inline:true},{name:"Value",value:`${item.goldValue} 💎`,inline:true}],thumbnail:{url:item.thumbnail}}]})}); }catch(e){} }

    async function startSpinningReel(pack) {
        const allItems = itemsData.filter(i => i.belongsToPack?.toLowerCase() === pack.name.toLowerCase());
        if(allItems.length===0) return;
        finalWinItem = getRandomItemFromPack(pack.name);
        // build 120 items for smooth spinning
        let reelItems = [];
        for(let i=0;i<100;i++) reelItems.push(allItems[Math.floor(Math.random()*allItems.length)]);
        reelItems.push(finalWinItem);
        for(let i=0;i<35;i++) reelItems.push(finalWinItem); // slowdown
        
        spinTrack.innerHTML = '';
        reelItems.forEach(item => {
            const div = document.createElement('div'); div.className = 'spin-item';
            div.innerHTML = `<img src="${item.thumbnail}" onerror="this.src='https://i.imgur.com/9MjQ9sD.png'"><div style="font-size:0.75rem;">${item.name.substring(0,14)}</div>`;
            spinTrack.appendChild(div);
        });
        
        let position = 0;
        const itemWidth = 190; // px per item (width+gap)
        const totalWidth = reelItems.length * itemWidth;
        spinTrack.style.width = `${totalWidth}px`;
        
        const speedMap = {'1': 9.5, '2': 6.2, '3': 3.8};
        let speed = speedMap[rollSpeedSelect.value] || 6.2;
        let deceleration = 0.992;
        let minSpeed = 0.08;
        let animId = null;
        let zoomFactor = 1;
        let zoomingIn = true;
        
        function applyZoom(scale) { spinContainerElem.style.transform = `scale(${scale})`; }
        
        async function triggerFlashZoomOut() {
            if(!toggleZoomFlash.checked) return;
            // zoom out rapidly + flash
            for(let s=1; s>0.7; s-=0.1) { applyZoom(s); await new Promise(r=>setTimeout(r,18)); }
            const flashDiv = document.createElement('div'); flashDiv.classList.add('flash-overlay'); document.body.appendChild(flashDiv);
            applyZoom(1);
            setTimeout(() => flashDiv.remove(), 350);
        }
        
        function spinStep() {
            position += speed;
            if(position >= totalWidth - (window.innerWidth * 0.6)) {
                speed *= deceleration;
                if(speed < minSpeed) {
                    cancelAnimationFrame(animId);
                    const finalIndex = Math.floor(position / itemWidth) + 3;
                    const landedItem = reelItems[Math.min(finalIndex, reelItems.length-1)];
                    finalWinItem = landedItem;
                    // final snap to winning item visually centered
                    const finalOffset = (finalIndex * itemWidth) - (spinTrack.parentElement.clientWidth/2) + (itemWidth/2);
                    spinTrack.style.transform = `translateX(-${Math.max(0, Math.min(finalOffset, totalWidth - spinTrack.parentElement.clientWidth))}px)`;
                    setTimeout(async () => {
                        await triggerFlashZoomOut();
                        spinResultArea.innerHTML = `<div class="winner-big">🏆 ${finalWinItem.name} 🏆</div><img src="${finalWinItem.thumbnail}" style="width:100px; border-radius:20px; margin:12px;"><div>✨ Rarity: ${finalWinItem.rarity}  |  💎 Value: ${finalWinItem.goldValue}</div><div>🎯 REEL STOPPED ON: ${finalWinItem.name}</div>`;
                        sendDiscord(pack, finalWinItem);
                    }, 80);
                    return;
                }
            }
            // SLOW ZOOM IN effect during spin
            if(zoomingIn && zoomFactor < 1.28) { zoomFactor += 0.004; applyZoom(zoomFactor); }
            spinTrack.style.transform = `translateX(-${position}px)`;
            animId = requestAnimationFrame(spinStep);
        }
        
        // reset zoom
        applyZoom(1);
        spinResultArea.innerHTML = '<div style="color:#ffaa77;">🌀 SPINNING... ZOOMING IN 🌀</div>';
        spinStep();
        currentSpinAnimation = () => cancelAnimationFrame(animId);
    }
    
    closeSpinBtn.addEventListener('click', () => {
        if(currentSpinAnimation) currentSpinAnimation();
        spinModal.classList.remove('active');
        spinTrack.innerHTML = '';
        spinResultArea.innerHTML = '';
        spinContainerElem.style.transform = 'scale(1)';
        selectedPack = null;
    });
    
    // Tabs
    document.querySelectorAll('.tab-btn').forEach(btn => { btn.addEventListener('click', () => { document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active-tab')); const id = btn.getAttribute('data-tab'); if(id==='packs') document.getElementById('packsTab').classList.add('active-tab'); if(id==='settings') document.getElementById('settingsTab').classList.add('active-tab'); if(id==='wins') document.getElementById('winsTab').classList.add('active-tab'); }); });
    
    loadData();
    updateBalanceUI();
</script>
</body>
</html>

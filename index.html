<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>5R5G PACKS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', 'Impact', system-ui, sans-serif;
            background: radial-gradient(circle at 20% 30%, #0a0507, #020101);
            min-height: 100vh;
            color: #ffecb3;
            overflow-x: hidden;
            position: relative;
        }

        /* animated golden dust overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255, 215, 0, 0.1) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: slowBreathing 6s infinite alternate;
        }

        @keyframes slowBreathing {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }

        /* particle canvas for stars/comets */
        #canvasFx {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 20;
        }

        h1 {
            font-size: 3.2rem;
            text-align: center;
            background: linear-gradient(135deg, #f9e45b, #ffb347, #ffd966);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(255, 200, 0, 0.5);
            letter-spacing: 2px;
        }

        .balance-card {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 80px;
            display: inline-block;
            padding: 8px 32px;
            border: 1px solid gold;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
            margin: 20px auto;
            text-align: center;
        }

        .balance-card span {
            font-size: 2rem;
            font-weight: bold;
            color: #ffd966;
            text-shadow: 0 0 6px #b8860b;
        }

        /* TABS */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            border-bottom: 2px solid rgba(255, 200, 0, 0.4);
            padding-bottom: 12px;
        }

        .tab-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 8px 32px;
            border-radius: 60px;
            cursor: pointer;
            color: #ffd966;
            transition: 0.2s;
            backdrop-filter: blur(5px);
        }

        .tab-btn.active {
            background: linear-gradient(145deg, #ffcc44, #e6a800);
            color: #1e1a0a;
            box-shadow: 0 0 18px gold;
        }

        .tab-content {
            display: none;
            animation: fadeGlow 0.4s ease;
        }

        .tab-content.active-tab {
            display: block;
        }

        @keyframes fadeGlow {
            from { opacity: 0; transform: scale(0.98); filter: blur(3px);}
            to { opacity: 1; transform: scale(1); filter: blur(0);}
        }

        /* Packs Grid */
        .packs-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
        }

        .pack-card {
            background: rgba(20, 15, 25, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 20px;
            width: 260px;
            text-align: center;
            transition: all 0.25s ease;
            border: 1px solid rgba(255, 215, 0, 0.5);
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .pack-card:hover {
            transform: translateY(-12px);
            border-color: gold;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.7);
        }

        .pack-thumb {
            width: 100px;
            height: 100px;
            object-fit: contain;
            background: #00000055;
            border-radius: 28px;
            padding: 8px;
            margin-bottom: 12px;
        }

        .pack-name {
            font-size: 1.9rem;
            font-weight: bold;
            background: linear-gradient(135deg, #fff0b5, #ffcf4a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .pack-cost {
            background: #000000aa;
            display: inline-block;
            padding: 6px 20px;
            border-radius: 40px;
            font-weight: bold;
            margin: 10px 0;
            font-size: 1.2rem;
            border: 1px solid #ffb347;
        }

        .open-case-btn {
            background: radial-gradient(circle at 30% 10%, #ffcc44, #b87c00);
            border: none;
            color: #1f1a0c;
            font-weight: bold;
            padding: 12px 0;
            width: 100%;
            border-radius: 60px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.05s linear;
            box-shadow: 0 5px 0 #8b5a00;
        }

        .open-case-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #8b5a00;
        }

        .settings-panel {
            background: rgba(10, 8, 12, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 30px;
            max-width: 550px;
            margin: 0 auto;
            border: 1px solid #e6b422;
        }

        .setting-item {
            margin: 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        select, input { background: #2a241a; border: 1px solid goldenrod; padding: 8px 16px; border-radius: 32px; color: #ffeaac; }

        .disabled-tab { text-align: center; margin-top: 80px; font-size: 1.6rem; opacity: 0.6; font-style: italic; }

        /* ---------- MODAL CSGO LOOTBOX STYLE (SLOT MACHINE REEL) ---------- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.96);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0s, opacity 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .case-modal {
            background: #0c0912ee;
            border-radius: 60px;
            padding: 20px 35px 45px;
            width: 90%;
            max-width: 1000px;
            text-align: center;
            border: 2px solid #ffd966;
            box-shadow: 0 0 80px rgba(255, 200, 0, 0.5);
            transition: transform 0.4s cubic-bezier(0.2, 1.2, 0.3, 1);
            transform: scale(1);
        }

        /* zoom animation classes */
        .case-modal.zoom-in {
            transform: scale(1.4);
            transition: transform 0.25s ease-out;
        }
        .case-modal.zoom-out-flash {
            transform: scale(0.95);
            filter: brightness(1.8) blur(2px);
            transition: transform 0.1s, filter 0.08s;
        }

        .reel-container {
            background: #000000aa;
            border-radius: 50px;
            padding: 20px;
            margin: 20px 0;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.8), 0 0 0 2px #ffcc66;
        }

        .slot-reel {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scrollbar-width: none;
            white-space: nowrap;
            padding: 12px 8px;
            scroll-behavior: auto;
            justify-content: flex-start;
            transition: all 0.05s linear;
        }
        .slot-reel::-webkit-scrollbar { display: none; }

        .item-card {
            flex: 0 0 auto;
            width: 140px;
            background: #1e1926;
            border-radius: 28px;
            padding: 15px 8px;
            text-align: center;
            transition: all 0.1s;
            border: 1px solid #ffcc66;
            box-shadow: 0 5px 15px black;
        }

        .item-img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin: 0 auto;
            display: block;
        }

        .winner-highlight {
            border: 4px solid gold;
            box-shadow: 0 0 35px gold;
            background: radial-gradient(circle, #ffd96655, #1e1926);
            transform: scale(1.02);
        }

        .result-area {
            margin-top: 20px;
            font-size: 1.5rem;
        }

        .close-result {
            background: #e6b422;
            border: none;
            padding: 12px 32px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.2rem;
            margin-top: 20px;
            cursor: pointer;
        }

        @keyframes impactFlashAnim {
            0% { background: radial-gradient(circle, rgba(255,215,0,0) 0%, rgba(0,0,0,0) 80%);}
            40% { background: radial-gradient(circle, rgba(255,255,200,0.95) 0%, rgba(255,100,0,0.8) 100%);}
            100% { background: radial-gradient(circle, rgba(255,215,0,0) 0%, rgba(0,0,0,0) 80%);}
        }

        .global-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1001;
            animation: impactFlashAnim 0.35s ease-out forwards;
        }
    </style>
</head>
<body>
<canvas id="canvasFx"></canvas>
<div class="container">
    <div style="text-align: center;"><h1>✦ GOLDEN LOOTBOX SIMULATOR ✦</h1></div>
    <div style="display: flex; justify-content: center;"><div class="balance-card">💎 CREDITS: <span id="userBalance">5000</span></div></div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="packs">📦 OPEN CASES</button>
        <button class="tab-btn" data-tab="settings">⚙️ EFFECTS</button>
        <button class="tab-btn" data-tab="wins">🏆 PREV WINS</button>
    </div>

    <div id="packsTab" class="tab-content active-tab"><div id="packsContainer" class="packs-grid"><div>🎴 Loading cases...</div></div></div>
    <div id="settingsTab" class="tab-content"><div class="settings-panel"><h3>🌟 CINEMATIC SETTINGS</h3><div class="setting-item"><label>💥 DRAMATIC ZOOM + FLASHBANG</label><input type="checkbox" id="toggleZoomFlash" checked></div><div class="setting-item"><label>🎇 COMETS & SHOOTING STARS</label><input type="checkbox" id="toggleStars" checked></div><div class="setting-item"><label>🎞️ REEL SPIN SPEED</label><select id="rollSpeed"><option value="1">VERY FAST</option><option value="2" selected>CLASSIC CSGO</option><option value="3">SLOW MOTION</option></select></div></div></div>
    <div id="winsTab" class="tab-content"><div class="disabled-tab">🔮 PAST WINS COMING SOON: EPIC HISTORY VAULT 🔮</div></div>
</div>

<!-- MODAL CSGO REEL STYLE -->
<div id="openingModal" class="modal-overlay">
    <div class="case-modal" id="caseModalElem">
        <h2 style="color:#ffd966;">🔁 SPINNING REEL</h2>
        <div class="reel-container"><div id="reelTrack" class="slot-reel"></div></div>
        <div id="finalReveal" class="result-area"></div>
        <button id="closeModalBtn" class="close-result">CONTINUE</button>
    </div>
</div>

<script>
    // ========= CONFIG ==========
    const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1498140574316888164/6f0h7UyyEVZUtg1DQItPHgyXeCtzhj1eQWUQAzdDRCBKBS8ZnzMwnPqFeXiQpu8Z5HEc";
    const PACKS_SHEET_ID = "181RdB0KhPbjnSHq-t7n_KhCFwwQwU8q4dU91u-MSHr4";
    const ITEMS_SHEET_ID = "1d0mZIPIKxWvcHRxoB6Bm20tMyx1OcfISOoy7Yi9u6jY";
    const PACKS_CSV = `https://docs.google.com/spreadsheets/d/${PACKS_SHEET_ID}/export?format=csv&gid=0`;
    const ITEMS_CSV = `https://docs.google.com/spreadsheets/d/${ITEMS_SHEET_ID}/export?format=csv&gid=0`;

    let packsData = [];
    let itemsData = [];
    let userGems = 5000;
    let currentRollInterval = null;
    let currentPackObj = null;
    let finalWinItem = null;

    // DOM
    const packsContainer = document.getElementById('packsContainer');
    const balanceSpan = document.getElementById('userBalance');
    const modal = document.getElementById('openingModal');
    const reelTrack = document.getElementById('reelTrack');
    const finalRevealDiv = document.getElementById('finalReveal');
    const closeModalButton = document.getElementById('closeModalBtn');
    const caseModalElem = document.getElementById('caseModalElem');
    const toggleZoomFlash = document.getElementById('toggleZoomFlash');
    const toggleStars = document.getElementById('toggleStars');
    const rollSpeedSelect = document.getElementById('rollSpeed');

    function updateBalanceUI() { balanceSpan.innerText = userGems; }

    // ========== STARFIELD CANVAS ==========
    const canvas = document.getElementById('canvasFx');
    let ctx = canvas.getContext('2d');
    let stars = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', () => { resizeCanvas(); initStars(60); });
    function initStars(count=70) { stars = []; for(let i=0;i<count;i++) { stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, radius: Math.random() * 2.8 + 1, alpha: Math.random() * 0.8 + 0.2, speedX: (Math.random() - 0.5) * 0.5, speedY: Math.random() * 2 + 1.2, isComet: Math.random() > 0.8, tail: Math.random() * 12 + 5 }); } }
    function drawStars() { if(!toggleStars.checked) { if(ctx) ctx.clearRect(0,0,canvas.width,canvas.height); return; } ctx.clearRect(0,0,canvas.width,canvas.height); for(let s of stars) { ctx.beginPath(); if(s.isComet) { ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.tail, s.y - s.tail*0.7); ctx.lineWidth = s.radius*1.5; ctx.strokeStyle = `rgba(255, 200, 70, ${s.alpha * 0.9})`; ctx.stroke(); ctx.beginPath(); ctx.arc(s.x, s.y, s.radius+1, 0, Math.PI*2); ctx.fillStyle = `rgba(255, 220, 100, ${s.alpha})`; ctx.fill(); } else { ctx.arc(s.x, s.y, s.radius, 0, Math.PI*2); ctx.fillStyle = `rgba(255, 215, 0, ${s.alpha})`; ctx.fill(); } s.x += s.speedX; s.y += s.speedY; if(s.x > canvas.width+50) s.x = -50; if(s.y > canvas.height+50) s.y = -40; if(s.x < -50) s.x = canvas.width+30; if(s.y < -50) s.y = canvas.height+20; } requestAnimationFrame(drawStars); }
    function startStarfield() { resizeCanvas(); initStars(70); drawStars(); }
    startStarfield();

    // helpers: load & parse CSV
    async function loadData() {
        try {
            const packResp = await fetch(PACKS_CSV); const packCsv = await packResp.text();
            const packRows = parseCSV(packCsv);
            packsData = packRows.map(r => ({ name: r.PackName, color: r.PackColor, cost: parseInt(r.PackCost), thumbnail: r.PackThumbnail || "https://i.imgur.com/9MjQ9sD.png" })).filter(p=>p.name);
            const itemResp = await fetch(ITEMS_CSV); const itemCsv = await itemResp.text();
            const itemRows = parseCSV(itemCsv);
            itemsData = itemRows.map(r => ({ name: r.ItemName, goldValue: parseInt(r.GoldValue), belongsToPack: r.BelongsToPack, thumbnail: r.ItemThumbnail, rarity: r.CardRarity, dropChance: parseFloat(r.dropChance) || (r.CardRarity === "Chaser"?5:95) })).filter(i=>i.name);
            if(packsData.length===0) packsData = [{ name:"Boots", color:"#E03FD8", cost:1000, thumbnail:"https://i.imgur.com/9MjQ9sD.png"}];
            if(itemsData.length===0) itemsData = [{ name:"Rainbow Boot", goldValue:10000, belongsToPack:"Boots", thumbnail:"https://trello.com/1/cards/69e1360a5fb96873ddeb5958/attachments/69e13611771b34a309ccacb7/download/image.png", rarity:"Chaser", dropChance:5},{ name:"Old Boot", goldValue:20, belongsToPack:"Boots", thumbnail:"https://trello.com/1/cards/69e13d2662c6fe6dfaae7fb0/attachments/69e13d2eb7b4c5c9e4798060/download/image.png", rarity:"Ordinary", dropChance:95}];
            renderPacks();
        } catch(e) { console.warn(e); fallbackLocal(); renderPacks(); }
    }
    function fallbackLocal() { packsData = [{ name:"Boots", color:"#E03FD8", cost:1000, thumbnail:"https://i.imgur.com/9MjQ9sD.png"}]; itemsData = [{ name:"Rainbow Boot", goldValue:10000, belongsToPack:"Boots", thumbnail:"https://trello.com/1/cards/69e1360a5fb96873ddeb5958/attachments/69e13611771b34a309ccacb7/download/image.png", rarity:"Chaser", dropChance:5},{ name:"Old Boot", goldValue:20, belongsToPack:"Boots", thumbnail:"https://trello.com/1/cards/69e13d2662c6fe6dfaae7fb0/attachments/69e13d2eb7b4c5c9e4798060/download/image.png", rarity:"Ordinary", dropChance:95}]; }
    function parseCSV(csv) { const lines = csv.split(/\r?\n/).filter(l=>l.trim()); if(lines.length<2) return []; const headers = lines[0].split(',').map(h=>h.replace(/"/g,'').trim()); let res=[]; for(let i=1;i<lines.length;i++) { let values=[], inQuote=false, cur=''; for(let ch of lines[i]){ if(ch==='"') inQuote=!inQuote; else if(ch===',' && !inQuote) { values.push(cur.trim().replace(/^"|"$/g,'')); cur=''; } else cur+=ch; } values.push(cur.trim().replace(/^"|"$/g,'')); let obj={}; headers.forEach((h,idx)=>{ obj[h]=values[idx]||''; }); res.push(obj); } return res; }

    function renderPacks() { packsContainer.innerHTML = packsData.map(pack => `<div class="pack-card" style="border-top:4px solid ${pack.color}"><img class="pack-thumb" src="${pack.thumbnail}" onerror="this.src='https://i.imgur.com/9MjQ9sD.png'"><div class="pack-name">${pack.name}</div><div class="pack-cost">💎 ${pack.cost} GEMS</div><button class="open-case-btn" style="background:${pack.color}40; border-color:${pack.color};">OPEN CASE</button></div>`).join(''); document.querySelectorAll('.open-case-btn').forEach((btn, idx) => { btn.addEventListener('click', (e) => { e.stopPropagation(); openPack(packsData[idx]); }); }); }

    // Weighted random based on dropChance
    function getRandomItemFromPack(packName) { let eligible = itemsData.filter(i => i.belongsToPack?.toLowerCase() === packName.toLowerCase()); if(eligible.length === 0) return { name:"Mystery Dust", goldValue:5, thumbnail:"https://i.imgur.com/9MjQ9sD.png", rarity:"Common" }; let totalChance = eligible.reduce((sum,i)=> sum + (i.dropChance || 1), 0); let rand = Math.random() * totalChance; let accum = 0; for(let item of eligible){ accum += (item.dropChance || 1); if(rand <= accum) return item; } return eligible[0]; }

    async function sendDiscord(pack, item){ if(!DISCORD_WEBHOOK) return; try{ await fetch(DISCORD_WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({embeds:[{title:`🎁 ${pack.name} CASE OPENED`,description:`**${item.name}** was unboxed!`,color:0xffaa33,fields:[{name:"Rarity",value:item.rarity,inline:true},{name:"Value",value:`${item.goldValue} 💎`,inline:true}],thumbnail:{url:item.thumbnail},footer:{text:"CSGO Style Reel"}}]})}); }catch(e){console.warn(e);} }

    // CSGO REEL ANIMATION: endless items scrolling then slow down & stop
    async function startReelAnimation(pack) {
        if(userGems < pack.cost) { alert(`Not enough! Need ${pack.cost} gems`); return false; }
        userGems -= pack.cost; updateBalanceUI();
        currentPackObj = pack;
        const allPackItems = itemsData.filter(i => i.belongsToPack?.toLowerCase() === pack.name.toLowerCase());
        if(allPackItems.length===0) return false;
        
        // Build massive item pool (reel sequence) 60 items for smooth scroll
        let reelItems = [];
        for(let i=0;i<70; i++) { reelItems.push(allPackItems[Math.floor(Math.random()*allPackItems.length)]); }
        finalWinItem = getRandomItemFromPack(pack.name); // true weighted random
        reelItems.push(finalWinItem);
        // extra clones after to simulate slowdown
        for(let i=0;i<12;i++) reelItems.push(finalWinItem);
        
        reelTrack.innerHTML = '';
        function renderReel(indexVisibleStart) {
            reelTrack.innerHTML = '';
            const visibleCount = 6;
            for(let i=0; i<visibleCount; i++) {
                let idx = (indexVisibleStart + i) % reelItems.length;
                let it = reelItems[idx];
                let div = document.createElement('div'); div.className = 'item-card';
                div.innerHTML = `<img class="item-img" src="${it.thumbnail}" onerror="this.src='https://i.imgur.com/9MjQ9sD.png'"><div style="font-size:0.8rem; margin-top:5px;">${it.name.substring(0,14)}</div>`;
                reelTrack.appendChild(div);
            }
        }
        
        let currentIndex = 0;
        const speedMap = {'1': 18, '2': 45, '3': 90};
        let step = speedMap[rollSpeedSelect.value] || 45;
        let cycles = 0;
        const maxSteps = 38; // total steps before stop
        let slowdownTrigger = false;
        
        return new Promise((resolve) => {
            const interval = setInterval(() => {
                if(!slowdownTrigger && cycles >= maxSteps-14) {
                    slowdownTrigger = true;
                    step = Math.max(12, step-2);
                }
                if(cycles >= maxSteps) {
                    clearInterval(interval);
                    // final exact show of winning item centered
                    renderReel(reelItems.length - 5); // make center show finalWinItem
                    setTimeout(() => {
                        triggerCinematicZoomFlash().then(() => {
                            finalRevealDiv.innerHTML = `<div style="font-size:2rem; font-weight:bold; color:#ffcc66;">🏆 ${finalWinItem.name} 🏆</div><img src="${finalWinItem.thumbnail}" style="width:110px; border-radius:20px; border:3px solid gold;"><div>⭐ ${finalWinItem.rarity} | 💎 ${finalWinItem.goldValue}</div>`;
                            sendDiscord(pack, finalWinItem);
                            resolve(finalWinItem);
                        });
                    }, 50);
                    return;
                }
                currentIndex = (currentIndex + 1) % reelItems.length;
                renderReel(currentIndex);
                cycles++;
            }, step);
            currentRollInterval = interval;
        });
    }
    
    // cinematic zoom + flashbang (zoom in, then sudden zoom out + flash)
    async function triggerCinematicZoomFlash() {
        if(!toggleZoomFlash.checked) return;
        caseModalElem.classList.add('zoom-in');
        await new Promise(r => setTimeout(r, 250));
        caseModalElem.classList.add('zoom-out-flash');
        const flashDiv = document.createElement('div'); flashDiv.classList.add('global-flash'); document.body.appendChild(flashDiv);
        await new Promise(r => setTimeout(r, 200));
        caseModalElem.classList.remove('zoom-in', 'zoom-out-flash');
        setTimeout(() => { if(flashDiv) flashDiv.remove(); }, 300);
    }
    
    async function openPack(pack) {
        if(userGems < pack.cost) { alert(`Need ${pack.cost} gems!`); return; }
        modal.classList.add('active');
        finalRevealDiv.innerHTML = '<div style="animation: pulse 1s infinite;">🌀 SPINNING REEL...</div>';
        await startReelAnimation(pack);
    }
    
    closeModalButton.addEventListener('click', () => {
        if(currentRollInterval) clearInterval(currentRollInterval);
        modal.classList.remove('active');
        reelTrack.innerHTML = '';
        finalRevealDiv.innerHTML = '';
        caseModalElem.classList.remove('zoom-in','zoom-out-flash');
    });
    
    // TABS
    document.querySelectorAll('.tab-btn').forEach(btn => { btn.addEventListener('click', () => { document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active-tab')); const id = btn.getAttribute('data-tab'); if(id==='packs') document.getElementById('packsTab').classList.add('active-tab'); if(id==='settings') document.getElementById('settingsTab').classList.add('active-tab'); if(id==='wins') document.getElementById('winsTab').classList.add('active-tab'); }); });
    
    loadData();
    updateBalanceUI();
</script>
</body>
</html>

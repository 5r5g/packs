<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>✦ AFTERBURNER CAROUSEL | Center Line Selector ✦ Epic Lootbox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            background: radial-gradient(circle at 20% 10%, #1e0a2b, #2a0a1a, #0f030c);
            min-height: 100vh;
            color: #ffecb3;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 40% 50%, rgba(156, 39, 176, 0.25), rgba(255, 80, 40, 0.2), rgba(255, 215, 0, 0.08));
            pointer-events: none;
            z-index: 0;
            animation: royalShift 14s infinite alternate;
        }

        @keyframes royalShift {
            0% { opacity: 0.5; background: radial-gradient(circle at 30% 40%, rgba(156,39,176,0.35), rgba(255,80,40,0.15), rgba(255,215,0,0.05));}
            100% { opacity: 1; background: radial-gradient(circle at 70% 60%, rgba(255,80,40,0.4), rgba(156,39,176,0.35), rgba(255,200,0,0.1));}
        }

        #canvasFx {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 20;
        }

        h1 {
            font-size: 3.2rem;
            text-align: center;
            background: linear-gradient(135deg, #ffd966, #ff6a4b, #c154e0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 25px rgba(193, 84, 224, 0.6);
        }

        .balance-card {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 80px;
            display: inline-block;
            padding: 8px 32px;
            border: 1px solid #ffaa66;
            box-shadow: 0 0 25px rgba(255, 80, 40, 0.7);
            margin: 20px auto;
            text-align: center;
        }

        .balance-card span {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(145deg, #ffd966, #ffaa55);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            border-bottom: 2px solid rgba(255, 100, 80, 0.5);
            padding-bottom: 12px;
        }

        .tab-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 8px 32px;
            border-radius: 60px;
            cursor: pointer;
            color: #ffcf9a;
            transition: 0.2s;
            backdrop-filter: blur(5px);
        }

        .tab-btn.active {
            background: linear-gradient(145deg, #ff4d4d, #b83bc2);
            color: #fff0b5;
            box-shadow: 0 0 18px #ff66aa;
        }

        .tab-content {
            display: none;
            animation: fadeGlow 0.4s ease;
        }

        .tab-content.active-tab { display: block; }

        @keyframes fadeGlow {
            from { opacity: 0; transform: scale(0.98); filter: blur(3px);}
            to { opacity: 1; transform: scale(1); filter: blur(0);}
        }

        .packs-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
        }

        .pack-card {
            background: rgba(20, 8, 28, 0.88);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 20px;
            width: 260px;
            text-align: center;
            transition: all 0.25s ease;
            border: 1px solid rgba(255, 120, 80, 0.7);
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .pack-card:hover {
            transform: translateY(-12px);
            border-color: #ffaa66;
            box-shadow: 0 0 35px rgba(255, 80, 120, 0.7);
        }

        .pack-thumb {
            width: 100px;
            height: 100px;
            object-fit: contain;
            background: #00000055;
            border-radius: 28px;
            padding: 8px;
            margin-bottom: 12px;
        }

        .pack-name {
            font-size: 1.9rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ffb347, #ff6a4b, #dd88ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .pack-cost {
            background: #000000aa;
            display: inline-block;
            padding: 6px 20px;
            border-radius: 40px;
            font-weight: bold;
            margin: 10px 0;
            font-size: 1.2rem;
            border: 1px solid #ff884d;
        }

        .open-case-btn {
            background: radial-gradient(circle at 30% 10%, #ff884d, #a83f9c);
            border: none;
            color: #fff0cc;
            font-weight: bold;
            padding: 12px 0;
            width: 100%;
            border-radius: 60px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.05s linear;
            box-shadow: 0 5px 0 #5a2a55;
        }

        .open-case-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #5a2a55; }

        .settings-panel {
            background: rgba(25, 10, 30, 0.88);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 30px;
            max-width: 550px;
            margin: 0 auto;
            border: 1px solid #ff6a4b;
        }
        .setting-item { margin: 20px 0; display: flex; justify-content: space-between; align-items: center; }
        select, input { background: #2a1025; border: 1px solid #ff8866; padding: 8px 16px; border-radius: 32px; color: #ffdead; font-weight: bold; }
        .disabled-tab { text-align: center; margin-top: 80px; font-size: 1.6rem; opacity: 0.6; font-style: italic; }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.97);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0s, opacity 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .modal-overlay.active { visibility: visible; opacity: 1; }

        .case-modal {
            background: #160c1cee;
            border-radius: 60px;
            padding: 25px 35px 45px;
            width: 90%;
            max-width: 1300px;
            text-align: center;
            border: 2px solid #ffaa66;
            box-shadow: 0 0 80px rgba(255, 80, 100, 0.6);
            transition: transform 0.3s cubic-bezier(0.2, 1.2, 0.3, 1);
            transform: scale(1);
        }

        .reel-wrapper {
            position: relative;
            margin: 20px 0;
            overflow: hidden;
            border-radius: 60px;
            background: #0a0312aa;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.6), 0 0 0 2px #ff7744;
            padding: 20px 0;
        }

        .reel-track {
            display: flex;
            gap: 20px;
            will-change: transform;
            transition: none;
            align-items: center;
            padding: 8px 0;
        }

        .item-card {
            flex: 0 0 auto;
            width: 170px;
            background: #231b2e;
            border-radius: 32px;
            padding: 18px 8px;
            text-align: center;
            border: 1px solid #ffaa77;
            box-shadow: 0 8px 18px black;
            transition: transform 0.08s linear;
            backdrop-filter: blur(4px);
        }

        .item-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin: 0 auto;
            display: block;
        }

        .center-line {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            background: linear-gradient(to bottom, #ff3366, #ffd966, #ff3366);
            box-shadow: 0 0 28px rgba(255, 51, 102, 0.9), 0 0 12px gold;
            z-index: 35;
            pointer-events: none;
            border-radius: 4px;
            animation: pulseLine 0.9s infinite alternate;
        }
        @keyframes pulseLine {
            0% { opacity: 0.7; width: 4px; box-shadow: 0 0 15px #ff3366;}
            100% { opacity: 1; width: 6px; box-shadow: 0 0 35px #ffaa44;}
        }
        .center-line::before {
            content: "▼";
            position: absolute;
            top: -32px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            color: #ffcc77;
            text-shadow: 0 0 8px red;
        }
        .center-line::after {
            content: "▲";
            position: absolute;
            bottom: -36px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            color: #ffcc77;
            text-shadow: 0 0 8px red;
        }

        .destiny-beam {
            position: absolute;
            top: -20px;
            bottom: -20px;
            left: 50%;
            width: 12px;
            background: linear-gradient(to bottom, rgba(255,220,100,0.9), rgba(255,100,80,0.9), rgba(255,220,100,0.9));
            transform: translateX(-50%) scaleX(1);
            filter: blur(8px);
            z-index: 40;
            pointer-events: none;
            opacity: 0;
            border-radius: 20px;
            box-shadow: 0 0 40px #ffaa55;
        }
        .destiny-beam.active {
            animation: beamBlast 0.6s ease-out forwards;
        }
        @keyframes beamBlast {
            0% { opacity: 0; width: 8px; filter: blur(4px);}
            20% { opacity: 1; width: 26px; filter: blur(10px); background: #fff0a0;}
            70% { opacity: 0.9; width: 18px; filter: blur(12px);}
            100% { opacity: 0; width: 4px; filter: blur(2px);}
        }

        .result-area {
            margin-top: 25px;
            font-size: 1.4rem;
            background: rgba(0,0,0,0.65);
            border-radius: 48px;
            padding: 16px;
            backdrop-filter: blur(8px);
        }
        .close-result {
            background: linear-gradient(145deg, #ff7744, #b83bc2);
            border: none;
            padding: 12px 32px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.2rem;
            margin-top: 20px;
            cursor: pointer;
            color: white;
        }
        .winner-name {
            font-size: 2.2rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ffd966, #ffaa66, #ff66cc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .global-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1001;
            animation: impactFlashAnim 0.35s ease-out forwards;
        }
        @keyframes impactFlashAnim {
            0% { background: radial-gradient(circle, rgba(255,215,0,0) 0%, rgba(0,0,0,0) 70%);}
            40% { background: radial-gradient(circle, rgba(255,200,100,0.98) 0%, rgba(255,60,80,0.95) 100%);}
            100% { background: radial-gradient(circle, rgba(255,215,0,0) 0%, rgba(0,0,0,0) 70%);}
        }
        .suspense-text {
            font-size: 1.2rem;
            letter-spacing: 3px;
            color: #ffaa88;
            animation: blinkText 1.2s infinite;
        }
        @keyframes blinkText { 0%{opacity:0.4;} 100%{opacity:1;} }
        
        .particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
        
        .speed-indicator {
            position: absolute;
            top: -30px;
            right: 20px;
            font-size: 12px;
            background: rgba(0,0,0,0.6);
            padding: 4px 12px;
            border-radius: 20px;
            font-family: monospace;
            color: #ffaa66;
            z-index: 45;
        }
    </style>
</head>
<body>
<canvas id="canvasFx"></canvas>
<div class="container">
    <div style="text-align: center;"><h1>✦ AFTERBURNER CAROUSEL ✦</h1></div>
    <div style="display: flex; justify-content: center;"><div class="balance-card">💎 ROYAL GEMS: <span id="userBalance">8500</span></div></div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="packs">📦 OPEN CASES</button>
        <button class="tab-btn" data-tab="settings">⚙️ EFFECTS</button>
        <button class="tab-btn" data-tab="wins">🏆 PREV WINS</button>
    </div>

    <div id="packsTab" class="tab-content active-tab"><div id="packsContainer" class="packs-grid"></div></div>
    <div id="settingsTab" class="tab-content"><div class="settings-panel"><h3 style="color:#ffaa77;">🎬 CINEMATIC FX</h3><div class="setting-item"><label>💥 ZOOM + FLASH IMPACT</label><input type="checkbox" id="toggleZoomFlash" checked></div><div class="setting-item"><label>🌠 COMETS & STARS</label><input type="checkbox" id="toggleStars" checked></div><div class="setting-item"><label>🎞️ MAX SPEED</label><select id="rollSpeed"><option value="1">INSANE (14px/f)</option><option value="2" selected>AFTERBURNER (10px/f)</option><option value="3">FAST (7px/f)</option></select></div></div></div>
    <div id="winsTab" class="tab-content"><div class="disabled-tab">🏆 HISTORY COMING SOON 🏆</div></div>
</div>

<div id="openingModal" class="modal-overlay">
    <div class="case-modal" id="caseModalElem">
        <h2 style="color:#ffaa77;">🔥 FAST CAROUSEL · CENTER LINE DICTATES</h2>
        <div class="reel-wrapper" style="position: relative;">
            <div class="speed-indicator" id="speedIndicator">SPEED: --</div>
            <div id="reelTrackContainer" style="overflow-x: hidden; overflow-y: visible;">
                <div id="reelTrack" class="reel-track"></div>
            </div>
            <div class="center-line"></div>
            <div id="destinyBeam" class="destiny-beam"></div>
            <canvas id="particleCanvas" class="particle-canvas"></canvas>
        </div>
        <div id="finalReveal" class="result-area"></div>
        <button id="closeModalBtn" class="close-result">CONTINUE</button>
    </div>
</div>

<script>
    const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1498140574316888164/6f0h7UyyEVZUtg1DQItPHgyXeCtzhj1eQWUQAzdDRCBKBS8ZnzMwnPqFeXiQpu8Z5HEc";
    const PACKS_SHEET_ID = "181RdB0KhPbjnSHq-t7n_KhCFwwQwU8q4dU91u-MSHr4";
    const ITEMS_SHEET_ID = "1d0mZIPIKxWvcHRxoB6Bm20tMyx1OcfISOoy7Yi9u6jY";
    const PACKS_CSV = `https://docs.google.com/spreadsheets/d/${PACKS_SHEET_ID}/export?format=csv&gid=0`;
    const ITEMS_CSV = `https://docs.google.com/spreadsheets/d/${ITEMS_SHEET_ID}/export?format=csv&gid=0`;

    let packsData = [], itemsData = [];
    let userGems = 8500;
    let currentAnimationId = null;
    let currentPackObj = null;
    let finalWinItem = null;
    let isRolling = false;
    let reelTrackDiv, trackContainer, particleCtx, particleCanvas;
    let webhookSentForCurrentOpen = false;
    let speedIndicator;
    
    const packsContainer = document.getElementById('packsContainer');
    const balanceSpan = document.getElementById('userBalance');
    const modal = document.getElementById('openingModal');
    const finalRevealDiv = document.getElementById('finalReveal');
    const closeModalButton = document.getElementById('closeModalBtn');
    const caseModalElem = document.getElementById('caseModalElem');
    const toggleZoomFlash = document.getElementById('toggleZoomFlash');
    const toggleStars = document.getElementById('toggleStars');
    const rollSpeedSelect = document.getElementById('rollSpeed');
    const destinyBeam = document.getElementById('destinyBeam');

    function updateBalanceUI() { balanceSpan.innerText = userGems; }

    // STARFIELD
    const canvasStars = document.getElementById('canvasFx');
    let ctxStars = canvasStars.getContext('2d');
    let stars = [];
    function resizeCanvas() { canvasStars.width = window.innerWidth; canvasStars.height = window.innerHeight; }
    window.addEventListener('resize', () => { resizeCanvas(); initStars(80); });
    function initStars(count=85) { stars = []; for(let i=0;i<count;i++) { stars.push({ x: Math.random() * canvasStars.width, y: Math.random() * canvasStars.height, radius: Math.random() * 2.8 + 1, alpha: Math.random() * 0.8 + 0.2, speedX: (Math.random() - 0.5) * 0.4, speedY: Math.random() * 2.2 + 0.8, isComet: Math.random() > 0.78, tail: Math.random() * 14 + 6 }); } }
    function drawStars() { if(!toggleStars.checked) { if(ctxStars) ctxStars.clearRect(0,0,canvasStars.width,canvasStars.height); return; } ctxStars.clearRect(0,0,canvasStars.width,canvasStars.height); for(let s of stars) { ctxStars.beginPath(); if(s.isComet) { ctxStars.moveTo(s.x, s.y); ctxStars.lineTo(s.x - s.tail*0.9, s.y - s.tail*0.6); ctxStars.lineWidth = s.radius*1.6; ctxStars.strokeStyle = `rgba(255, 150, 80, ${s.alpha * 0.9})`; ctxStars.stroke(); ctxStars.beginPath(); ctxStars.arc(s.x, s.y, s.radius+1, 0, Math.PI*2); ctxStars.fillStyle = `rgba(255, 200, 100, ${s.alpha})`; ctxStars.fill(); } else { ctxStars.arc(s.x, s.y, s.radius, 0, Math.PI*2); ctxStars.fillStyle = `rgba(255, 215, 150, ${s.alpha})`; ctxStars.fill(); } s.x += s.speedX; s.y += s.speedY; if(s.x > canvasStars.width+60) s.x = -60; if(s.y > canvasStars.height+60) s.y = -40; if(s.x < -60) s.x = canvasStars.width+40; if(s.y < -40) s.y = canvasStars.height+30; } requestAnimationFrame(drawStars); }
    function startStarfield() { resizeCanvas(); initStars(85); drawStars(); }
    startStarfield();

    // DATA
    async function loadData() {
        try {
            const packResp = await fetch(PACKS_CSV); const packCsv = await packResp.text();
            const packRows = parseCSV(packCsv);
            packsData = packRows.map(r => ({ name: r.PackName, color: r.PackColor, cost: parseInt(r.PackCost), thumbnail: r.PackThumbnail || "https://i.imgur.com/9MjQ9sD.png" })).filter(p=>p.name);
            const itemResp = await fetch(ITEMS_CSV); const itemCsv = await itemResp.text();
            const itemRows = parseCSV(itemCsv);
            itemsData = itemRows.map(r => ({ name: r.ItemName, goldValue: parseInt(r.GoldValue), belongsToPack: r.BelongsToPack, thumbnail: r.ItemThumbnail, rarity: r.CardRarity, dropChance: parseFloat(r.dropChance) || 50 }));
            if(packsData.length===0) fallbackLocal();
            if(itemsData.length===0) fallbackLocal();
            renderPacks();
        } catch(e) { fallbackLocal(); renderPacks(); }
    }
    function fallbackLocal() { packsData = [{ name:"Boots", color:"#E03FD8", cost:1000, thumbnail:"https://i.imgur.com/9MjQ9sD.png"}]; itemsData = [{ name:"Rainbow Boot", goldValue:10000, belongsToPack:"Boots", thumbnail:"https://trello.com/1/cards/69e1360a5fb96873ddeb5958/attachments/69e13611771b34a309ccacb7/download/image.png", rarity:"Chaser", dropChance:5},{ name:"Old Boot", goldValue:20, belongsToPack:"Boots", thumbnail:"https://trello.com/1/cards/69e13d2662cfe6dfaae7fb0/attachments/69e13d2eb7b4c5c9e4798060/download/image.png", rarity:"Ordinary", dropChance:95}]; }
    function parseCSV(csv) { const lines = csv.split(/\r?\n/).filter(l=>l.trim()); if(lines.length<2) return []; const headers = lines[0].split(',').map(h=>h.replace(/"/g,'').trim()); let res=[]; for(let i=1;i<lines.length;i++) { let values=[], inQuote=false, cur=''; for(let ch of lines[i]){ if(ch==='"') inQuote=!inQuote; else if(ch===',' && !inQuote) { values.push(cur.trim().replace(/^"|"$/g,'')); cur=''; } else cur+=ch; } values.push(cur.trim().replace(/^"|"$/g,'')); let obj={}; headers.forEach((h,idx)=>{ obj[h]=values[idx]||''; }); res.push(obj); } return res; }
    function renderPacks() { packsContainer.innerHTML = packsData.map(pack => `<div class="pack-card" style="border-top:4px solid ${pack.color}"><img class="pack-thumb" src="${pack.thumbnail}" onerror="this.src='https://i.imgur.com/9MjQ9sD.png'"><div class="pack-name">${pack.name}</div><div class="pack-cost">💎 ${pack.cost} GEMS</div><button class="open-case-btn" style="background:${pack.color}60; border-color:${pack.color};">OPEN CASE</button></div>`).join(''); document.querySelectorAll('.open-case-btn').forEach((btn, idx) => { btn.addEventListener('click', (e) => { e.stopPropagation(); openPack(packsData[idx]); }); }); }

    function getRandomItemFromPack(packName) { 
        let eligible = itemsData.filter(i => i.belongsToPack?.toLowerCase() === packName.toLowerCase()); 
        if(eligible.length === 0) return { name:"Mystic Core", goldValue:80, thumbnail:"https://i.imgur.com/9MjQ9sD.png", rarity:"Arcane" }; 
        let totalChance = eligible.reduce((sum,i)=> sum + (i.dropChance || 1), 0); 
        let rand = Math.random() * totalChance; 
        let accum = 0; 
        for(let item of eligible){ accum += (item.dropChance || 1); if(rand <= accum) return item; } 
        return eligible[0];
    }

    async function sendDiscord(pack, item){ 
        if(!DISCORD_WEBHOOK) return; 
        try{ 
            await fetch(DISCORD_WEBHOOK,{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({
                    embeds:[{
                        title:`✨ ${pack.name.toUpperCase()} CAROUSEL OPEN`,
                        description:`**${item.name}** claimed by center line!`,
                        color:0xdd55aa,
                        fields:[
                            {name:"Rarity", value:item.rarity, inline:true},
                            {name:"💎 Value", value:`${item.goldValue}`, inline:true}
                        ],
                        thumbnail:{url:item.thumbnail},
                        footer:{text:"Instant Webhook • Afterburner Spin"}
                    }]
                })
            });
        } catch(e){ console.warn(e); } 
    }

    function initParticleCanvas() { particleCanvas = document.getElementById('particleCanvas'); if(particleCanvas) particleCtx = particleCanvas.getContext('2d'); }
    function burstParticlesAt(x, y) {
        if(!particleCtx) return;
        const canvasRect = particleCanvas.getBoundingClientRect();
        const relativeX = x - canvasRect.left;
        const relativeY = y - canvasRect.top;
        let particles = [];
        for(let i=0;i<20;i++) {
            particles.push({ x: relativeX, y: relativeY, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8-3, life: 1, color: `hsl(${Math.random()*40 + 20}, 80%, 60%)` });
        }
        function animateParticles() {
            if(!particleCtx) return;
            particleCtx.clearRect(0,0,particleCanvas.width,particleCanvas.height);
            let alive = false;
            for(let p of particles) {
                p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life -= 0.04;
                if(p.life > 0) { alive=true; particleCtx.globalAlpha = p.life; particleCtx.fillStyle = p.color; particleCtx.fillRect(p.x-3, p.y-3, 6, 6); }
            }
            if(alive) requestAnimationFrame(animateParticles);
            else particleCtx.clearRect(0,0,particleCanvas.width,particleCanvas.height);
        }
        animateParticles();
    }

    // FAST SPINNING WITH LONG TRACK
    async function startPhysicalReel(pack) {
        if(userGems < pack.cost) { alert(`Need ${pack.cost} gems!`); return false; }
        userGems -= pack.cost; updateBalanceUI();
        currentPackObj = pack;
        webhookSentForCurrentOpen = false;
        speedIndicator = document.getElementById('speedIndicator');
        
        let eligibleItems = itemsData.filter(i => i.belongsToPack?.toLowerCase() === pack.name.toLowerCase());
        if(eligibleItems.length===0) eligibleItems = [{ name:"Mysterious Gem", goldValue:50, thumbnail:"https://i.imgur.com/9MjQ9sD.png", rarity:"Common"}];
        
        // BUILD MASSIVE SEQUENCE - 200 items so it spins for a long time
        let loopItems = [];
        for(let i=0;i<180;i++) {
            loopItems.push(eligibleItems[Math.floor(Math.random()*eligibleItems.length)]);
        }
        finalWinItem = getRandomItemFromPack(pack.name);
        // add winning item many times at the end
        for(let i=0;i<60;i++) loopItems.push(finalWinItem);
        
        reelTrackDiv.innerHTML = '';
        loopItems.forEach(item => {
            const card = document.createElement('div'); card.className = 'item-card';
            card.innerHTML = `<img class="item-img" src="${item.thumbnail}" onerror="this.src='https://i.imgur.com/9MjQ9sD.png'"><div style="margin-top:8px; font-size:13px;">${item.name.substring(0,18)}</div>`;
            card.setAttribute('data-item', JSON.stringify(item));
            reelTrackDiv.appendChild(card);
        });
        
        // force reflow to get accurate width
        await new Promise(r => setTimeout(r, 10));
        const containerRect = trackContainer.getBoundingClientRect();
        const trackWidth = reelTrackDiv.scrollWidth;
        let translateX = 0;
        reelTrackDiv.style.transform = `translateX(${translateX}px)`;
        
        // EXTREME FAST SPEEDS - pixels per frame
        const speedMap = {'1': 16, '2': 12, '3': 8};
        let speed = speedMap[rollSpeedSelect.value] || 12;
        let deceleration = 0.992;
        let minSpeed = 0.3;
        let animationId = null;
        let lastCenterItemId = null;
        const centerLineElement = document.querySelector('.center-line');
        let frameCount = 0;
        
        finalRevealDiv.innerHTML = `<div class="suspense-text">⚡ AFTERBURNER ACTIVE ⚡</div>`;
        
        // Send webhook IMMEDIATELY when case opens (before spin)
        if(!webhookSentForCurrentOpen) {
            await sendDiscord(pack, finalWinItem);
            webhookSentForCurrentOpen = true;
        }
        
        function step() {
            if(!isRolling) return;
            translateX -= speed;
            const maxTranslate = -(trackWidth - containerRect.width);
            // allow wrapping effect by resetting position when exceeding
            if(translateX <= maxTranslate - 400) {
                translateX = translateX + (trackWidth - containerRect.width);
            }
            reelTrackDiv.style.transform = `translateX(${translateX}px)`;
            
            // update speed indicator
            if(speedIndicator && frameCount % 3 === 0) {
                speedIndicator.innerHTML = `SPEED: ${Math.abs(speed).toFixed(1)} px/f`;
            }
            frameCount++;
            
            const lineRect = centerLineElement.getBoundingClientRect();
            const lineCenterX = lineRect.left + lineRect.width/2;
            let closestItem = null, minDist = Infinity;
            const cards = document.querySelectorAll('#reelTrack .item-card');
            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                const itemCenter = rect.left + rect.width/2;
                const dist = Math.abs(itemCenter - lineCenterX);
                if(dist < minDist) { minDist = dist; closestItem = card; }
                // 3D perspective scaling
                const distanceFromCenter = Math.abs(itemCenter - lineCenterX);
                let scale = 1;
                if(distanceFromCenter < 80) scale = 1.12;
                else if(distanceFromCenter < 140) scale = 1.04;
                else scale = 0.96;
                card.style.transform = `scale(${scale})`;
            });
            
            // Particle burst and click tick on crossing
            if(closestItem) {
                let currentItemId = closestItem.innerHTML;
                if(lastCenterItemId !== currentItemId) {
                    burstParticlesAt(lineRect.left+lineRect.width/2, lineRect.top+lineRect.height/2);
                    const tickDiv = document.createElement('div');
                    tickDiv.style.cssText = `position:absolute; left:${lineRect.left+lineRect.width/2-10}px; top:${lineRect.top+lineRect.height/2-10}px; width:20px; height:20px; background:radial-gradient(circle, #ffdd99, #ff6633); border-radius:50%; pointer-events:none; z-index:100; opacity:0.9; filter:blur(1px);`;
                    document.querySelector('.reel-wrapper').appendChild(tickDiv);
                    setTimeout(()=>tickDiv.remove(), 80);
                    lastCenterItemId = currentItemId;
                }
            }
            
            // deceleration
            if(speed > minSpeed) {
                speed *= deceleration;
                animationId = requestAnimationFrame(step);
            } else {
                // FINAL STOP - determine winning item
                const finalCards = document.querySelectorAll('#reelTrack .item-card');
                let bestCard = null, bestDist = Infinity;
                const finalLineRect = centerLineElement.getBoundingClientRect();
                const finalLineX = finalLineRect.left + finalLineRect.width/2;
                finalCards.forEach(card => {
                    const rect = card.getBoundingClientRect();
                    const dist = Math.abs(rect.left + rect.width/2 - finalLineX);
                    if(dist < bestDist) { bestDist = dist; bestCard = card; }
                });
                if(bestCard) finalWinItem = JSON.parse(bestCard.getAttribute('data-item'));
                else finalWinItem = finalWinItem || { name:"Destiny Artifact", goldValue:500, thumbnail:"https://i.imgur.com/9MjQ9sD.png", rarity:"Legendary" };
                isRolling = false;
                cancelAnimationFrame(animationId);
                
                // DESTINY BEAM + RUMBLE
                destinyBeam.classList.remove('active');
                void destinyBeam.offsetWidth;
                destinyBeam.classList.add('active');
                
                const modalElem = document.getElementById('caseModalElem');
                modalElem.style.transform = 'translate(2px,2px)';
                setTimeout(()=> modalElem.style.transform = '', 100);
                
                setTimeout(()=> {
                    if(toggleZoomFlash.checked) {
                        caseModalElem.classList.add('zoom-in');
                        setTimeout(()=> { caseModalElem.classList.add('zoom-out-flash');
                        const flashDiv = document.createElement('div'); flashDiv.classList.add('global-flash'); document.body.appendChild(flashDiv);
                        setTimeout(()=> flashDiv.remove(), 300);
                        }, 180);
                        setTimeout(()=> caseModalElem.classList.remove('zoom-in','zoom-out-flash'), 400);
                    }
                    finalRevealDiv.innerHTML = `<div class="winner-name">🏆 ${finalWinItem.name} 🏆</div>
                    <img src="${finalWinItem.thumbnail}" style="width:110px; border-radius:25px; border:3px solid #ffaa77; margin:12px;">
                    <div>✨ ${finalWinItem.rarity || 'Rare'} | 💎 ${finalWinItem.goldValue}</div>
                    <div>🎯 CENTER LINE LANDED ON: ${finalWinItem.name}</div>`;
                }, 60);
            }
        }
        isRolling = true;
        animationId = requestAnimationFrame(step);
        return new Promise((resolve) => { const waitInterval = setInterval(() => { if(!isRolling) { clearInterval(waitInterval); resolve(finalWinItem); } }, 50); });
    }
    
    async function openPack(pack) {
        if(userGems < pack.cost) { alert(`Insufficient Gems! Need ${pack.cost}`); return; }
        modal.classList.add('active');
        reelTrackDiv = document.getElementById('reelTrack');
        trackContainer = document.getElementById('reelTrackContainer');
        initParticleCanvas();
        await startPhysicalReel(pack);
    }
    
    closeModalButton.addEventListener('click', () => {
        isRolling = false; modal.classList.remove('active');
        if(reelTrackDiv) reelTrackDiv.style.transform = 'translateX(0px)';
        destinyBeam.classList.remove('active');
        webhookSentForCurrentOpen = false;
    });
    
    document.querySelectorAll('.tab-btn').forEach(btn => { btn.addEventListener('click', () => { document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active-tab')); const id = btn.getAttribute('data-tab'); if(id==='packs') document.getElementById('packsTab').classList.add('active-tab'); if(id==='settings') document.getElementById('settingsTab').classList.add('active-tab'); if(id==='wins') document.getElementById('winsTab').classList.add('active-tab'); }); });
    
    loadData(); updateBalanceUI();
</script>
